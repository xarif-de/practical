# Blueprint: https://git.xarif.de/base/dagger-ci-basics
# Reusable workflow: https://git.xarif.de/base/dagger-modules

# Release tags (v*) → :<tag>, :<major.minor>, :<major> (and :latest) with the
# size/speed-optimised `dist` profile (build/Cargo.toml). Split from
# docker-publish.yml because an expression in `with:` cannot tell a tag from a
# branch on Forgejo 15.0.9 (see the comment there); the build arg is literal here.
name: docker-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  publish-image:
    uses: base/dagger-modules/.forgejo/workflows/dagger-call.yml@main
    with:
      dagger-function: publish-image
      dagger-args: --source=build --tests=tests/tests.yaml --build-arg=CARGO_PROFILE=dist
    secrets:
      registry-password: ${{ secrets.REGISTRY_TOKEN }}
      mirror-registry-username: ${{ secrets.MIRROR_REGISTRY_USERNAME }}
      mirror-registry-password: ${{ secrets.MIRROR_REGISTRY_TOKEN }}
