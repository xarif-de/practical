# What CI runs: `dagger call -m git.xarif.de/base/dagger-modules.git@main ci`
# (base/dagger-modules docs/ci.md). Locally the same call builds and tests only.
image:
  source: build
  tests: tests/tests.yaml
  publish:
    # v* tags: the size-optimised whole-program profile (build/Cargo.toml).
    # main keeps the fast `release` profile.
    release-build-args: [CARGO_PROFILE=dist]
rust:
  source: build
# Dependency updates release themselves as a patch (base/dagger-modules docs/release.md):
# .forgejo/workflows/release.yml (templates/release.yml), release-bot, secret RELEASE_BOT_TOKEN.
# build/ only: an e2e/ test dependency does not change the image.
release:
  version: cargo
  manifest: build/Cargo.toml
  paths: [build/]
  name: PractiCal
