# github.com publication, read by kubernetes/forgejo resources/mirror-lib.sh from this
# repo's default branch. Every GitHub feature is off unless declared here.
description: Calendar, contacts and tasks for your own server - a fast, modern web app on top of RustiCal
homepage: https://xarif.gitlab.io/docker/practical/
features:
  # Public bug reports and contributions, as on gitlab.com. Merged on GitHub they would be
  # overwritten by the next mirror push: they are taken over on Forgejo (CONTRIBUTING.md).
  issues: true
  pull_requests: true
