[package]
name = "practical"
version = "0.12.0"
edition = "2024"
rust-version = "1.98"
description = "Web UI next to RustiCal: groups, collections, app tokens, calendar and contacts views on RustiCal's own SQLite store"
license = "AGPL-3.0-or-later"
repository = "https://git.xarif.de/docker/practical"
publish = false

[[bin]]
name = "practical"
path = "src/main.rs"

# Dependency policy (plan NFR "wenige Rust-Dependencies"): everything below is
# either a RustiCal crate, already in RustiCal's own dependency graph (same
# major version, so it resolves to ONE copy), or carries a one-line reason.
# `cargo deny check advisories bans sources` (mise run deny) is the gate.
[dependencies]
# --- RustiCal itself: the ONLY way we touch its SQLite store. Tag == the
# rustical image tag deployed in kubernetes/rustical (build.rs exports it;
# `practical check-rustical-image <ref>` and the deployment tool_check compare).
rustical_store = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
rustical_store_sqlite = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
rustical_ical = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
rustical_oidc = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
rustical_dav_push = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
# --- in RustiCal's graph (same versions as its workspace)
caldata = { version = "0.17", features = ["chrono-tz"] }
axum = "0.8"
axum-extra = { version = "0.12", features = ["typed-header"] }
headers = "0.4"
http = "1.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
tower-sessions = "0.15"
askama = { version = "0.16", features = ["serde_json"] }
askama_web = { version = "0.16", features = ["axum-0.8"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json"] }
sqlx-sqlite = { version = "0.9", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
async-trait = "0.1"
uuid = { version = "1.19", features = ["v4", "fast-rng"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2", "json"] }
url = "2.5"
futures-util = "0.3"
base64ct = { version = "1.8", features = ["alloc"] }
sha2 = "0.11"
web-push = { git = "https://github.com/lennart-k/rust-web-push" }
openidconnect = "4.0"
regex = "1.13"
vtimezones-rs = "0.3"
# --- new direct crates (each with its reason)
# D9: translations as Fluent .ftl files. fluent-bundle + unic-langid are the
# minimal pair; fluent-templates would add ignore/flume/walkdir for a feature
# (runtime directory scanning) we do not use.
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
# Already linked through tower-http's gzip (same version, same default backend): decodes an embedded
# .gz asset once for a client that accepts no compression (routes/assets.rs).
flate2 = "1.1"
# Decodes the region-name tables build.rs embeds brotli-compressed (domain/holidays.rs: 566 KB of JSON →
# 74 KB); the decoder half of the `brotli` build dependency (same version, already in Cargo.lock), pure Rust.
brotli-decompressor = "6"
# Global allocator (main.rs): musl's malloc is slow under allocation-heavy work. Measured 2026-10-06
# (arm64 musl image build, 1 CPU / 192 MiB container like prod, synthetic 3,920-object DB, 20 requests
# per path, 2 rounds, vs the musl build of e74c076): CPU per request −23…30 % (/calendar month 109.5 →
# 78 ms, /settings 84 → 60, /api/mentions 185 → 129); RSS after the run 41.0 → 37.7 MB only with the
# Dockerfile's MIMALLOC_PURGE_DELAY=0 + MIMALLOC_ARENA_EAGER_COMMIT=0 — mimalloc's defaults held 66-103 MB.
# Adds libmimalloc-sys (C, built with cc — already a build dependency of the bundled SQLite).
mimalloc = { version = "0.1", default-features = false }

# Build only (build.rs: minify + precompress the static assets; nothing of it ships in the binary).
[build-dependencies]
# JS minifier with a real parser (a syntax error fails the build): app.js brotli 100.2 → 69.4 KB.
# One project (oxc-project), 6 lines because the ES2020 target lives in oxc_compat.
oxc_allocator = "0.153"
oxc_parser = { version = "0.153", default-features = false }
oxc_span = "0.153"
oxc_minifier = "0.153"
oxc_codegen = { version = "0.153", default-features = false }
oxc_compat = "0.153"
# brotli quality 11 (every browser over HTTPS takes br); 4 small crates, pure Rust.
brotli = "9"
flate2 = "1.1"
# regions(): reads src/data/regions.json; i18n_js(): formats the js-* messages of locales/ exactly as the
# binary does — all three are dependencies of the binary already (same versions)
serde_json = "1.0"
fluent-bundle = "0.16"
unic-langid = "0.9"

# Every build (branches, main — what runs on plan.xarif.de): no cross-crate LTO, one codegen unit.
# `lto = false` is rustc's thin-LOCAL LTO inside each crate. Measured 2026-10-02 (arm64 container
# capped at 8 CPUs like the CI dind, rust 1.99, one run each), rebuild after a CSS change / cold:
#   lto = "thin"  249 s / 371 s, 26.7 MB    lto = false  115 s / 290 s, 25.8 MB
#   lto = "off"    93 s / 220 s, 26.3 MB
# Cross-crate thin LTO cost ~60 % of every rebuild and made the binary no smaller. `false` over `off`:
# the smallest of the three for 22 s. (Also measured, not taken: mold −6 %, incremental −28 % with
# thin LTO, codegen-units=256 slower.)
# Re-measured 2026-10-06 (same container setup, every file touched as the Dockerfile does; with the
# build.rs asset minifier and mimalloc): codegen-units 16 → 1 = binary 26.6 → 21.2 MB (−20 %),
# rebuild 115 → 120 s (3 runs each, ±1 s), cold 293 → 252 s (one run each). CPU per request
# unchanged within noise (±5 %, 1-CPU container), as for thin LTO (26.7 MB, rebuild 343 s) and fat
# LTO + 1 unit (= dist: 20.7 MB, rebuild 291 s) — those two stay off the per-push build.
[profile.release]
strip = true
lto = false
codegen-units = 1
opt-level = 3

# Release tags only (dagger-ci.yaml release-build-args: CARGO_PROFILE=dist on `v*` tags): the whole program
# optimised as one unit — smallest, fastest binary, single-threaded link.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# build.rs only: brotli 11 of the assets took 4.2 s per build-script run at the build-dependency default
# opt-level 0, 2.4 s at 3 (host, 3 runs each; 1.3 s with one thread per file). Not in the binary.
[profile.release.package.brotli]
opt-level = 3
[profile.dev.package.brotli]
opt-level = 3
