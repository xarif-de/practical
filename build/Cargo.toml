[package]
name = "practical"
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
description = "Web UI next to RustiCal: groups, collections, app tokens, calendar and contacts views on RustiCal's own SQLite store"
license = "AGPL-3.0-or-later"
repository = "https://git.xarif.de/docker/practical"
publish = false

[[bin]]
name = "practical"
path = "src/main.rs"

# Dependency policy (few Rust dependencies): everything below is
# either a RustiCal crate, already in RustiCal's own dependency graph (same
# major version, so it resolves to ONE copy), or carries a one-line reason.
# `cargo deny check advisories bans sources` (mise run deny) is the gate.
[dependencies]
# --- RustiCal itself: the ONLY way we touch its SQLite store. Tag == the
# rustical image tag deployed in kubernetes/rustical (build.rs exports it;
# `practical check-rustical-image <ref>` and the deployment tool_check compare).
rustical_store = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
rustical_store_sqlite = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
rustical_ical = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
rustical_oidc = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
rustical_dav_push = { git = "https://github.com/lennart-k/rustical", tag = "v0.16.4" }
# --- in RustiCal's graph (same versions as its workspace)
caldata = { version = "0.17", features = ["chrono-tz"] }
axum = "0.8"
http = "1.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
tower-sessions = "0.15"
askama = { version = "0.16", features = ["serde_json"] }
askama_web = { version = "0.16", features = ["axum-0.8"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json"] }
sqlx-sqlite = { version = "0.9", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
async-trait = "0.1"
uuid = { version = "1.19", features = ["v4", "fast-rng"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2", "json"] }
url = "2.5"
futures-util = "0.3"
base64ct = { version = "1.8", features = ["alloc"] }
sha2 = "0.11"
web-push = { git = "https://github.com/lennart-k/rust-web-push" }
openidconnect = "4.0"
regex = "1.13"
vtimezones-rs = "0.3"
# RustiCal's own password hashing (same features): a failed login for an unknown user name checks a dummy
# argon2 hash, so the answer time does not tell which names exist (auth.rs post_login)
password-auth = { version = "1.0", features = ["argon2", "pbkdf2"] }
# axum's own body/query decoders (same versions): extract.rs reads JSON and urlencoded input itself, to name the
# field a rejected value came in (serde_path_to_error) and answer every rejection the same way
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
# --- new direct crates (each with its reason)
# Translations as Fluent .ftl files. fluent-bundle + unic-langid are the
# minimal pair; fluent-templates would add ignore/flume/walkdir for a feature
# (runtime directory scanning) we do not use.
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
# Already linked through fluent-bundle (same version): its AST names the variants of a plural message, so
# the browser gets every form (i18n.rs `plural_forms`) and picks one with Intl.PluralRules.
fluent-syntax = "0.12"
# Already linked through tower-http's gzip (same version, same default backend): decodes an embedded
# .gz asset once for a client that accepts no compression (routes/assets.rs) and the region-name tables
# build.rs embeds gzip-compressed (domain/holidays.rs).
flate2 = "1.1"
# Pages, fragments and JSON as brotli (etag.rs `revalidate`, one shot over the buffered body, the window sized
# to it); the same crate and version build.rs compresses the assets with. tower-http's compression-br streams
# with brotli's default 4 MiB window: +80-100 MB RSS after the bench burst (2026-10-07, 2 runs).
brotli = "9"
# Global allocator (main.rs): musl's malloc is slow under allocation-heavy work. Measured 2026-10-06 (arm64 musl,
# 1 CPU / 192 MiB like prod, 3,920-object DB): CPU per request −23…30 % (/calendar 109.5 → 78 ms); RSS 41.0 → 37.7 MB
# only with the Dockerfile's MIMALLOC_* (defaults held 66-103 MB). libmimalloc-sys builds with cc (bundled SQLite needs it too).
mimalloc = { version = "0.1", default-features = false }

# Tests only (testkit.rs, it/http.rs: `ServiceExt::oneshot` drives the router without a socket); in axum's graph.
[dev-dependencies]
tower = "=0.5.3"

# Build only (build.rs: minify + precompress the static assets; nothing of it ships in the binary).
[build-dependencies]
# JS minifier with a real parser (a syntax error fails the build): app.js brotli 100.2 → 69.4 KB.
# One project (oxc-project), 6 lines because the ES2020 target lives in oxc_compat.
oxc_allocator = "0.153"
oxc_parser = { version = "0.153", default-features = false }
oxc_span = "0.153"
oxc_minifier = "0.153"
oxc_codegen = { version = "0.153", default-features = false }
oxc_compat = "0.153"
# brotli quality 11 (every browser over HTTPS takes br); 4 small crates, pure Rust.
brotli = "9"
flate2 = "1.1"
# regions(): reads src/data/regions.json; i18n_js(): runs src/i18n.rs itself (`#[path]`) — all of these are
# dependencies of the binary already, same versions (tracing: i18n.rs' log lines, no subscriber here)
serde_json = "1.0"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
tracing = "0.1"

# Every build (branches, main): `lto = false` (rustc's thin-LOCAL LTO per crate), one codegen unit. Measured in an
# 8-CPU arm64 container like the CI dind, rebuild after a CSS change: cross-crate thin LTO 249 vs 115 s, binary not
# smaller; `false` over `off`: 25.8 vs 26.3 MB for +22 s (2026-10-02); codegen-units 16 → 1: binary 26.6 → 21.2 MB,
# rebuild 115 → 120 s, CPU per request ±5 % (2026-10-06).
[profile.release]
strip = true
lto = false
codegen-units = 1
opt-level = 3

# Release tags only (dagger-ci.yaml: CARGO_PROFILE=dist on `v*`): fat LTO. Measured 2026-10-06 (arm64 musl, 1 CPU /
# 192 MiB, 10 paths, median of 3 interleaved rounds) vs release: CPU of first requests 646 → 620 ms (−4 %, lowest in
# every round), warm 121 → 116 ms, 21.1 → 20.8 MB; opt-level 2, thin LTO, mimalloc v2 not better, "s" +11 % CPU.
# `panic` stays `unwind` (tasks::guarded catches a loop's panic). No target-cpu: prod is amd64 Intel (Hetzner CX53),
# and x86-64-v3 (AVX2) would not start on AVX-less CPUs.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# e2e/build-server.sh's default (E2E_PROFILE=release: the shipped one): an edit rebuilds in 5.6-12.3 s vs 98-100 s
# for release, cold 129 vs 185 s (host, 2026-10-06); its visual baseline = release's (0 of 1134 states differ). Its
# binary size follows the module layout (256 units are partitioned per module): the bench judges size on release only.
[profile.e2e]
inherits = "release"
codegen-units = 256
incremental = true

# build.rs only: brotli 11 of the assets 4.2 → 2.4 s per build-script run at opt-level 3 (host, 3 runs). Not in the binary.
[profile.release.package.brotli]
opt-level = 3
[profile.dev.package.brotli]
opt-level = 3
