<div class="toolbar"><h1 id="title" title="{{ ctx.t("pick-date") }}">{{ title }}</h1><button class="btn icon-btn" data-nav="today" title="{{ ctx.t("today") }}" aria-label="{{ ctx.t("today") }}"><svg class="ico" aria-hidden="true"><use href="#i-today"/></svg></button>{% if view != "month" %}<span class="seg"><button data-nav="prev" aria-label="‹">‹</button><button data-nav="next" aria-label="›">›</button></span>{% endif %}{# the month view turns the page with the wheel (app.js `monthWheel`) #}<span class="grow"></span><span class="seg" role="group"><button data-view="day"{% if view == "day" %} aria-pressed="true"{% endif %}>{{ ctx.t("view-day") }}</button><button data-view="week"{% if view == "week" %} aria-pressed="true"{% endif %}>{{ ctx.t("view-week") }}</button><button data-view="month"{% if view == "month" %} aria-pressed="true"{% endif %}>{{ ctx.t("view-month") }}</button><span class="more"><button data-more aria-haspopup="true"{% if in_more %} aria-pressed="true"{% endif %}>{% if in_more %}{{ view_label }}{% else %}{{ ctx.t("view-more") }}{% endif %} ▾</button><div class="pop"><a href="/calendar?view=planner&date={{ date }}" data-view="planner">{{ ctx.t("view-planner") }}</a><a href="/calendar?view=weekends&date={{ date }}" data-view="weekends">{{ ctx.t("view-weekends") }}</a><a href="/calendar?view=vacation&date={{ date }}" data-view="vacation">{{ ctx.t("view-vacation") }}</a><a href="/calendar?view=countdown&date={{ date }}" data-view="countdown">{{ ctx.t("view-countdown") }}</a><a href="/calendar?view=numbers&date={{ date }}" data-view="numbers">{{ ctx.t("view-numbers") }}</a></div></span></span></div>
{{ body|safe }}
