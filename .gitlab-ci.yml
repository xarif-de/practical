# Blueprint: https://git.xarif.de/base/dagger-ci-basics
# Reusable workflow: https://git.xarif.de/base/dagger-modules

include:
  - remote: 'https://gitlab.com/xarif/base/dagger-modules/-/raw/main/ci/dagger-call.gitlab-ci.yml'

build-image:
  extends: .dagger-call
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  variables:
    DAGGER_FUNCTION: build-image
    DAGGER_ARGS: '--source=build --tests=tests/tests.yaml'

publish-image:
  extends: .dagger-call
  # A SemVer tag always publishes. On the default branch, publish only when
  # something that ends up in the image changed (a README-only commit must not
  # produce a fresh digest → a needless Renovate digest bump + pod roll). The
  # `changes` set mirrors what the job feeds dagger.
  rules:
    # release tags build the size/speed-optimised `dist` profile (build/Cargo.toml); main the fast one
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        DAGGER_ARGS: '--source=build --tests=tests/tests.yaml --build-arg=CARGO_PROFILE=dist'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      changes:
        - build/**/*
        - tests/**/*
        - .gitlab-ci.yml
  variables:
    DAGGER_FUNCTION: publish-image
    DAGGER_ARGS: '--source=build --tests=tests/tests.yaml'
