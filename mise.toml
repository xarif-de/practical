# Blueprint: https://git.xarif.de/base/dagger-ci-basics
# Reusable workflow: https://git.xarif.de/base/dagger-modules

[tasks.pipeline]
description = "The CI pipeline, locally: cargo-deny + image build (with cargo test, build/Dockerfile) + tests/tests.yaml (dagger-ci.yaml); never publishes"
run = "DAGGER_NO_NAG=1 dagger call -m git.xarif.de/base/dagger-modules.git@main ci --source=."

[tasks.image]
description = "Build the image (native platform) and load it into the local Docker engine as xarif-practical"
run = """
export DAGGER_NO_NAG=1
TARBALL="/tmp/practical-$$.tar"
trap 'rm -f "$TARBALL"' EXIT   # a trap, not a last line: it must not mask a failed build
dagger call -m git.xarif.de/base/dagger-modules.git@main build-image --source=build export --path="$TARBALL" &&
docker tag "$(docker load -i "$TARBALL" | sed 's/Loaded image.*: //')" xarif-practical &&
echo "Image available as: xarif-practical"
"""

[tasks.deny]
description = "Supply-chain gate for the Rust source in build/: cargo-deny (RustSec advisories + banned crate versions + source allowlist)"
# Config: build/deny.toml. cargo-deny comes from the host dotfiles (mise global). The same three
# checks gate CI on every push (dagger-ci.yaml `rust` → verify-rust); this
# task is the local shortcut.
run = """
if ! command -v cargo-deny >/dev/null 2>&1; then
  echo "cargo-deny not found — install it: mise install (global) or brew install cargo-deny" >&2
  exit 127
fi
exec cargo deny --manifest-path build/Cargo.toml check advisories bans sources
"""

[tasks.test]
description = "Rust unit tests (rust-toolchain.toml: the builder image's Rust version — one Renovate group moves both) in this checkout's VM container (e2e/vm.sh; own target dir, content-checked freshness, mbx cache: e2e/cargo.sh)"
run = "e2e/cargo.sh test"

[tasks.logo]
description = "Brand: build/assets/icon.svg + logo.svg + lettering.svg from brand/build.py (Inter Display ExtraBold outlined; the font zip is cached in e2e/.work/brand, SHA-256 checked); design: brand/README.md"
run = "uv run -q brand/build.py"

[tasks.doc]
description = "API doc of the Rust code (rustdoc with private items: a [[bin]] crate), built in the VM container (e2e/vm.sh, e2e/cargo.sh) and copied to e2e/.work/doc; any rustdoc warning (a broken intra-doc link too) fails; prints the index.html path. Module docs start at build/src/main.rs"
run = '''
exec e2e/vm.sh sh -ec '
RUSTDOCFLAGS="-D warnings" e2e/cargo.sh doc --no-deps --document-private-items
T="${E2E_TARGET_DIR:-$HOME/.cache/practical-e2e/target-$(cd build && pwd -P | shasum | cut -c1-12)}"
rm -rf e2e/.work/doc && mkdir -p e2e/.work && cp -R "$T/doc" e2e/.work/doc
echo "API doc: $PWD/e2e/.work/doc/practical/index.html"'
'''

[tasks.dev]
description = "Feedback loop in a VM container of its own (e2e/vm.sh --serve, port DEV_PORT, default 4001): watchexec (polling: colima passes no file events) rebuilds+restarts on src/templates/locales edits, CSS/JS are served from disk, the browser reloads itself and re-logs DEV_USER in. DB = the copy from `mise run dev-db` (under $HOME)"
run = '''
export DB="${DB:-$HOME/.cache/practical-dev/db.sqlite3}"
[ -f "$DB" ] || { echo "no DB copy at $DB — run: mise run dev-db" >&2; exit 1; }
P="${DEV_PORT:-4001}"
exec e2e/vm.sh --serve "$P" sh -ec '
cd build # rust-toolchain.toml picks the toolchain (no RUSTUP_TOOLCHAIN in the container to override it)
export PRACTICAL__RUSTICAL_URL= PRACTICAL__DB_PATH="$DB" PRACTICAL__ALLOW_PASSWORD_LOGIN=true \
  PRACTICAL__PUBLIC_URL="http://localhost:$0" PRACTICAL__BIND="0.0.0.0:$0" \
  PRACTICAL__DEV_ASSETS_DIR="$PWD/assets" \
  PRACTICAL__PUBLIC_DAV_URL=https://dav.example.org PRACTICAL__DEV_LOGIN="${DEV_USER:-thomass}"
exec watchexec --poll=500ms --restart --watch src --watch templates --watch locales --watch Cargo.toml --watch build.rs -- mbx run -- serve' "$P"
'''

[tasks.dev-db]
description = "Fresh COPY of the production DB for `mise run dev` (cluster stays read-only: VACUUM INTO in the backup sidecar); sets password 'devpass' for DEV_USER (default thomass)"
run = '''
set -e
DEST="$HOME/.cache/practical-dev/db.sqlite3"; mkdir -p "$(dirname "$DEST")"
POD="$(kubectl get pod -n rustical -l app=rustical -o jsonpath='{.items[0].metadata.name}')"
kubectl exec -n rustical "$POD" -c sqlite-backup -- sqlite3 /var/lib/rustical/db.sqlite3 "VACUUM INTO '/tmp/dev-copy.db'"
kubectl cp -n rustical -c sqlite-backup "$POD:/tmp/dev-copy.db" "$DEST" >/dev/null
kubectl exec -n rustical "$POD" -c sqlite-backup -- rm -f /tmp/dev-copy.db
# the rustical CLI of the SAME release as the pinned crates sets the test password on the copy
TAG="$(sed -n 's/.*tag = "v\([^"]*\)".*/\1/p' build/Cargo.toml | head -1)"
docker run --rm -v "$(dirname "$DEST"):/var/lib/rustical" "registry.gitlab.com/xarif/docker/rustical:v$TAG" \
  rustical principals edit "${DEV_USER:-thomass}" --for-testing-password-from-arg devpass
echo "copy at $DEST — login ${DEV_USER:-thomass} / devpass on http://localhost:4001"
'''

[tasks.e2e-seed]
description = "Build the synthetic e2e fixture DB (e2e/.work/fixture.sqlite3): RustiCal CLI in docker + (VM container) PractiCal HTTP, frozen clock, blocked egress"
run = "e2e/seed/seed.sh"

[tasks.readme-shots]
description = "Screenshots for the README, the site gallery and docs/features.md: e2e-profile server build → showcase DB (e2e/demo/seed.sh, synthetic, frozen clock, blocked egress) → Playwright shots → docs/images/NN-*.webp + e2e/demo/shots.json (E2E_PORT, SEED_PORT); build, stage 2 and shots in the VM container (e2e/vm.sh: Linux fonts)"
run = '''
set -e
W="$PWD/e2e/.work/demo"
e2e/vm.sh sh -c 'cd e2e && { [ -d node_modules ] || npm ci --no-fund --no-audit; }'
e2e/build-server.sh "$W/practical"
e2e/demo/seed.sh "$W/practical" "$W/demo.sqlite3"
exec e2e/vm.sh node e2e/demo/shots.mjs "$W/practical" "$W/demo.sqlite3"
'''

[tasks.docs-nav]
description = "Docs navigation: back links to the start page (docs/index.md) + its documentation table at the end of every page it lists (e2e/demo/docs-nav.mjs; `-- --check` = exit 1 if out of date)"
run = "node e2e/demo/docs-nav.mjs"

[tasks.site]
description = "The GitLab Pages site, locally (VM container, e2e/vm.sh): site/build.mjs (docs/index.md + gallery, docs/*.md, CONTRIBUTING.md; every link checked) + a fresh API doc (rustdoc -D warnings, e2e/cargo.sh) in api/ → e2e/.work/site; preview: python3 -m http.server -d e2e/.work/site 4501"
run = '''
exec e2e/vm.sh sh -ec '
OUT="$PWD/e2e/.work/site"
# npm ci again whenever the lockfile is newer than the installed tree (npm ci writes node_modules/.package-lock.json)
[ site/node_modules/.package-lock.json -nt site/package-lock.json ] || (cd site && npm ci --no-fund --no-audit)
node site/build.mjs --out "$OUT"
RUSTDOCFLAGS="-D warnings" e2e/cargo.sh doc --no-deps --document-private-items
T="${E2E_TARGET_DIR:-$HOME/.cache/practical-e2e/target-$(cd build && pwd -P | shasum | cut -c1-12)}"
cp -R "$T/doc" "$OUT/api"
echo "site: $OUT/index.html (API doc: $OUT/api/practical/index.html)"
echo "preview: python3 -m http.server -d $OUT 4501  →  http://localhost:4501/"'
'''

[tasks.e2e]
description = "Functional e2e suite (Playwright, e2e/functional) against an e2e-profile build of this checkout (E2E_PROFILE=release: the shipped profile), in the VM container (e2e/vm.sh); spec files on E2E_WORKERS (4) workers, each file on fresh servers + fixture copies; args → playwright test"
run = '''
exec e2e/vm.sh sh -ec '
cd e2e
[ -d node_modules ] || npm ci --no-fund --no-audit
npx playwright install chromium >/dev/null
exec npx playwright test "$@"' sh
'''

[tasks.e2e-baseline]
description = "Visual baseline (PNG + DOM + computed style of every UI state) in the VM container (e2e/vm.sh): mise run e2e-baseline -- [outdir], default ~/.cache/practical-e2e/<sha>; outdir under ~/.cache/practical-e2e or the checkout"
run = "e2e/baseline.sh"

[tasks.e2e-compare]
description = "Diff two baselines (pixels, DOM, computed style) in the VM container: mise run e2e-compare -- <dirA> <dirB>; exit 1 on any difference"
run = "e2e/vm.sh node e2e/compare.mjs"

[tasks.bench]
description = "Performance bench of this checkout on the synthetic big DB (e2e/bench), in the VM container (e2e/vm.sh): server latency/RSS/idle CPU, wire bytes, UI interaction times, sizes → mise run bench -- [--out dir], default ~/.cache/practical-e2e/bench-<sha>"
run = "e2e/vm.sh node e2e/bench/bench.mjs"

[tasks.bench-compare]
description = "A/B bench against a former `mise run bench` dir (made in the VM container too: it runs the ref's binary), interleaved: mise run bench-compare -- <ref-dir> [--out dir]; exit 1 on a regression beyond the thresholds"
run = "e2e/vm.sh node e2e/bench/bench.mjs --ref"

[tasks.chaos]
description = "Chaos Tier 1 alone: the seeded UI monkey with network chaos (e2e/chaos, one worker, ~60 s; CHAOS_SEEDS=1,2,3 CHAOS_STEPS=6), in the VM container (e2e/vm.sh); part of `gate`"
run = '''
exec e2e/vm.sh sh -ec '
cd e2e
[ -d node_modules ] || npm ci --no-fund --no-audit
npx playwright install chromium >/dev/null
E2E_SUITE=chaos exec npx playwright test "$@"' sh
'''

[tasks.a11y]
description = "Accessibility alone: axe-core over fixed states (desktop light + dark, phone light) against e2e/a11y-allow.txt + the keyboard flows (e2e/a11y, ~30 s), then a11y-check.mjs (stale allow-list lines), in the VM container (e2e/vm.sh); part of `gate`"
run = '''
exec e2e/vm.sh sh -ec '
cd e2e
[ -d node_modules ] || npm ci --no-fund --no-audit
npx playwright install chromium >/dev/null
E2E_SUITE=a11y npx playwright test "$@"
exec node a11y-check.mjs' sh
'''

[tasks.gate-quick]
description = "The cheapest gate, in the VM container (e2e/vm.sh, heavy lock): cargo test → API doc (rustdoc -D warnings) → docs/site links → server build → functional suite (e2e/gate.sh). `gate` adds chaos and a11y"
run = "e2e/gate.sh quick"

[tasks.gate]
description = "Gate of an ordinary change: gate-quick + chaos + a11y. No reference baseline, no image comparison (that is `gate-visual`)"
run = "e2e/gate.sh full"

[tasks.gate-visual]
description = "Gate of a change that must look identical: gate + visual baseline + compare against a reference baseline of the base commit + theme-cover: mise run gate-visual -- <ref-dir> (or E2E_REF). Opt-in — only for a refactoring whose point is that no pixel moves"
run = "e2e/gate.sh visual"
